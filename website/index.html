<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A staggered-DiD text-mining study of GRI 3 adoption among TWSE firms and global peers, 2021–2024. Reinier Kirsten · Sustainability And Green Energy · National Chengchi University." />

  <title>Materiality Mining — Research Project Site</title>

  <!-- Fonts (preconnect for performance; actual imports are injected by script.js) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Base styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + ReactDOM (production builds) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- Marked — converts markdown to HTML for live-fetched content -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <!-- Babel standalone — transpiles JSX in script.js on first load.
       For a faster site, run `npx babel script.js -o script.compiled.js`
       and swap this tag for a plain <script src="script.compiled.js">. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Application (JSX — transpiled by Babel above) -->
  <script type="text/babel" src="script.js" data-presets="react"></script>
</body>
</html>
